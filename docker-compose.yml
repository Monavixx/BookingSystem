services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: BookingSystemDB
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BookingSystemDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: BookingSystemDB
  migrate:
    build:
      context: .
      target: migrations
    depends_on:
      db:
        condition: service_healthy
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
        ACCEPT_EULA: "Y"
        SEQ_FIRSTRUN_ADMINPASSWORD: "admin"
    container_name: BookingSystemSeq
  redis:
    image: redis:latest
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass admin
  app:
    container_name: booking_system_app
    build: 
      context: .
      target: app
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      seq:
        condition: service_started
    ports:
      - "8080:8080"
    
