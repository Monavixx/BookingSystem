services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: BookingSystemDB
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    container_name: BookingSystemDB
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
        ACCEPT_EULA: "Y"
        SEQ_FIRSTRUN_ADMINPASSWORD: "admin"
    container_name: BookingSystemSeq
  redis:
    image: redis:latest
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass admin
